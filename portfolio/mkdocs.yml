site_name: Faryal_Portfolio_Website
site_description: Statistician | Aspiring Data Scientist | Skilled in Machine Learning, Data Analysis, Python | Data Cleaning | Data Visualization
site_author: Faryal

# Navigation menu
nav:
  - Home: index.md
  - About: about.md
  - Projects: projects.md

# Theme settings
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
    - scheme: slate
      primary: teal
      accent: teal
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.annotate
    - toc.integrate

# Extra configuration for social icons (appears in header or footer)
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/faryalrifaz3374
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/faryal-rifaz
    - icon: fontawesome/brands/kaggle
      link: https://www.kaggle.com/faryalrifaz3374
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/FaryalRifaz

# Markdown extensions 
markdown_extensions:
  - admonition
  - footnotes
  - codehilite
  - tables
  - toc:
      permalink: true
